[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pangenome-analysis"
version = "0.1.0"
description = "Pangenome analysis scripts and workflows"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.12"
authors = [
    { name = "University of Leicester Microbiology and Infection Biology" }
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "dendropy>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["pga"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
